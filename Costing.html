<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Costing Tool</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --highlight: #fef08a;
      --success: #dcfce7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: var(--primary); }
    
    /* Session Tabs */
    .session-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    .tab {
      padding: 8px 16px;
      background: #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active {
      background: var(--primary);
      color: white;
    }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-add { background: #22c55e; color: white; }
    .btn-danger { background: #ef4444; color: white; float: right; }
    
    /* Global Inputs */
    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .input-card {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
    }
    .input-card.highlight {
      background: var(--highlight);
      border: 1px solid #fde047;
    }
    .input-card label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .input-card input { width: 90%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; }
    
    /* Table */
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { padding: 10px; border: 1px solid var(--border); text-align: left; }
    th { background: #f8fafc; }
    td input, td select { width: 90%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; }

    /* Summary Highlights */
    .summary-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .summary-card {
      padding: 16px;
      border-radius: 8px;
      background: #f1f5f9;
      text-align: center;
    }
    .summary-card.final {
      background: var(--success);
      border: 2px solid #86efac;
    }
    .summary-card h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: #475569; }
    .summary-card .val { font-size: 1.4rem; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>Product Costing Dashboard</h1>
  
  <!-- Multi-Session Management Tabs -->
  <div class="session-bar" id="sessionBar">
    <button class="btn btn-add" onclick="createSession()">+ New Product Session</button>
  </div>

  <div id="sessionContent">
    <button class="btn btn-danger" onclick="deleteCurrentSession()">Delete Current Session</button>
    <br><br>

    <!-- Top Inputs -->
    <div class="inputs-grid">
      <div class="input-card">
        <label>Product Name</label>
        <input type="text" id="prodName" onchange="updateSessionData()">
      </div>
      <div class="input-card highlight">
        <label>Total Yield (Quantity Created)</label>
        <input type="number" id="prodYield" value="10" min="1" onchange="calculateCosting()">
      </div>
      <div class="input-card highlight">
        <label>Markup Percentage (%)</label>
        <input type="number" id="prodMarkup" value="50" min="0" onchange="calculateCosting()">
      </div>
    </div>

    <!-- Ingredients Table -->
    <table>
      <thead>
        <tr>
          <th>Ingredient / Material</th>
          <th>Unit</th>
          <th>Cost per Unit</th>
          <th>Quantity Used</th>
          <th>Total Cost</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="materialsBody"></tbody>
    </table>
    <button class="btn btn-add" onclick="addMaterialRow()">+ Add Ingredient</button>

    <!-- Highlighted Summary Calculations -->
    <div class="summary-section">
      <div class="summary-card">
        <h3>Total Batch Cost</h3>
        <div class="val" id="totalBatchCost">$0.00</div>
      </div>
      <div class="summary-card">
        <h3>Cost Per Item</h3>
        <div class="val" id="costPerItem">$0.00</div>
      </div>
      <div class="summary-card final">
        <h3>Suggested Price</h3>
        <div class="val" id="suggestedPrice">$0.00</div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase Realtime Sync Setup -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Replace with your Firebase Project Configuration
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let sessions = {};
  let currentSessionId = null;
  const unitsList = ["g", "kg", "ml", "L", "oz", "lb", "pcs", "cup", "tbsp", "tsp"];

  // Real-time Cloud Sync
  onValue(ref(db, 'costing_sessions'), (snapshot) => {
    sessions = snapshot.val() || {};
    const keys = Object.keys(sessions);
    if (keys.length === 0) {
      createSession("Default Product");
    } else {
      if (!currentSessionId || !sessions[currentSessionId]) {
        currentSessionId = keys[0];
      }
      renderSessionsUI();
      loadCurrentSessionData();
    }
  });

  window.createSession = function(nameOverride) {
    const id = 'session_' + Date.now();
    const name = nameOverride || prompt("Enter new product/session name:", "New Item");
    if (!name) return;

    sessions[id] = {
      name: name,
      yieldQty: 10,
      markupPct: 50,
      materials: [
        { name: "Sample Item 1", unit: "pcs", cost: 1.5, qty: 2 }
      ]
    };
    currentSessionId = id;
    saveToCloud();
  };

  window.deleteCurrentSession = function() {
    if (Object.keys(sessions).length <= 1) {
      alert("You must keep at least one session!");
      return;
    }
    if (confirm("Delete this session?")) {
      remove(ref(db, 'costing_sessions/' + currentSessionId));
      currentSessionId = null;
    }
  };

  function saveToCloud() {
    if (!currentSessionId) return;
    set(ref(db, 'costing_sessions'), sessions);
  }

  function renderSessionsUI() {
    const bar = document.getElementById('sessionBar');
    bar.innerHTML = '<button class="btn btn-add" onclick="createSession()">+ New Session</button>';
    
    Object.keys(sessions).forEach(id => {
      const tab = document.createElement('div');
      tab.className = `tab ${id === currentSessionId ? 'active' : ''}`;
      tab.innerText = sessions[id].name || "Unnamed Product";
      tab.onclick = () => { currentSessionId = id; renderSessionsUI(); loadCurrentSessionData(); };
      bar.insertBefore(tab, bar.firstChild);
    });
  }

  function loadCurrentSessionData() {
    const data = sessions[currentSessionId];
    if (!data) return;

    document.getElementById('prodName').value = data.name || "";
    document.getElementById('prodYield').value = data.yieldQty || 1;
    document.getElementById('prodMarkup').value = data.markupPct || 0;

    const tbody = document.getElementById('materialsBody');
    tbody.innerHTML = "";

    (data.materials || []).forEach((mat, idx) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><input type="text" value="${mat.name}" onchange="updateMaterial(${idx}, 'name', this.value)"></td>
        <td>
          <select onchange="updateMaterial(${idx}, 'unit', this.value)">
            ${unitsList.map(u => `<option value="${u}" ${mat.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
          </select>
        </td>
        <td><input type="number" step="0.01" value="${mat.cost}" onchange="updateMaterial(${idx}, 'cost', parseFloat(this.value)||0)"></td>
        <td><input type="number" step="0.01" value="${mat.qty}" onchange="updateMaterial(${idx}, 'qty', parseFloat(this.value)||0)"></td>
        <td class="rowTotal">$${((mat.cost || 0) * (mat.qty || 0)).toFixed(2)}</td>
        <td><button onclick="removeMaterial(${idx})">❌</button></td>
      `;
      tbody.appendChild(row);
    });

    calculateCosting();
  }

  window.updateSessionData = function() {
    sessions[currentSessionId].name = document.getElementById('prodName').value;
    saveToCloud();
  };

  window.addMaterialRow = function() {
    if (!sessions[currentSessionId].materials) sessions[currentSessionId].materials = [];
    sessions[currentSessionId].materials.push({ name: "", unit: "g", cost: 0, qty: 0 });
    saveToCloud();
  };

  window.removeMaterial = function(idx) {
    sessions[currentSessionId].materials.splice(idx, 1);
    saveToCloud();
  };

  window.updateMaterial = function(idx, key, val) {
    sessions[currentSessionId].materials[idx][key] = val;
    saveToCloud();
  };

  window.calculateCosting = function() {
    const yieldQty = parseFloat(document.getElementById('prodYield').value) || 1;
    const markupPct = parseFloat(document.getElementById('prodMarkup').value) || 0;

    sessions[currentSessionId].yieldQty = yieldQty;
    sessions[currentSessionId].markupPct = markupPct;

    let batchTotal = 0;
    (sessions[currentSessionId].materials || []).forEach(m => {
      batchTotal += (m.cost || 0) * (m.qty || 0);
    });

    const costPerItem = batchTotal / yieldQty;
    const suggestedPrice = costPerItem * (1 + (markupPct / 100));

    document.getElementById('totalBatchCost').innerText = `$${batchTotal.toFixed(2)}`;
    document.getElementById('costPerItem').innerText = `$${costPerItem.toFixed(2)}`;
    document.getElementById('suggestedPrice').innerText = `$${suggestedPrice.toFixed(2)}`;
  };
</script>

</body>
</html>
