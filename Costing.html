<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Costing Tool</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --highlight: #fef08a;
      --success: #dcfce7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: var(--primary); font-size: 1.5rem; }
    
    .session-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    .tab {
      padding: 8px 14px;
      background: #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--primary);
      color: white;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .btn-add { background: #22c55e; color: white; }
    .btn-danger { background: #ef4444; color: white; width: 100%; margin-bottom: 16px;}
    
    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100%, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (min-width: 600px) {
      .inputs-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
      .btn-danger { width: auto; float: right; margin-bottom: 0; }
    }
    .input-card {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
    }
    .input-card.highlight {
      background: var(--highlight);
      border: 1px solid #fde047;
    }
    .input-card label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .input-card input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { padding: 10px; border: 1px solid var(--border); text-align: left; }
    th { background: #f8fafc; }
    td input, td select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem;}
    
    @media screen and (max-width: 650px) {
      table { border: 0; }
      table thead { border: none; clip: rect(0 0 0 0); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; }
      table tr { border-bottom: 3px solid var(--border); display: block; margin-bottom: 16px; padding: 12px; background: #f8fafc; border-radius: 8px;}
      table td { border-bottom: 1px solid var(--border); display: block; font-size: .9em; text-align: right; padding: 8px 0; }
      table td::before {
        content: attr(data-label);
        float: left;
        font-weight: bold;
        text-transform: uppercase;
        color: #64748b;
        margin-top: 8px;
      }
      table td:last-child { border-bottom: 0; text-align: center; }
      table td:last-child::before { display: none; }
      table td input, table td select { width: 60%; display: inline-block; }
      .mobile-full-btn { width: 100%; }
    }

    .summary-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100%, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    @media (min-width: 600px) {
      .summary-section { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    }
    .summary-card {
      padding: 16px;
      border-radius: 8px;
      background: #f1f5f9;
      text-align: center;
    }
    .summary-card.final {
      background: var(--success);
      border: 2px solid #86efac;
    }
    .summary-card h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: #475569; }
    .summary-card .val { font-size: 1.5rem; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>Product Costing Dashboard</h1>
  
  <div class="session-bar" id="sessionBar">
    <button class="btn btn-add" onclick="createSession()">+ New Session</button>
  </div>

  <div id="sessionContent">
    <button class="btn btn-danger" onclick="deleteCurrentSession()">Delete Current Session</button>

    <div class="inputs-grid">
      <div class="input-card">
        <label>Product Name</label>
        <input type="text" id="prodName" onchange="updateSessionData()">
      </div>
      <div class="input-card highlight">
        <label>Total Yield (Quantity Created)</label>
        <input type="number" id="prodYield" value="10" min="1" inputmode="decimal" onchange="updateSessionData()">
      </div>
      <div class="input-card highlight">
        <label>Markup Percentage (%)</label>
        <input type="number" id="prodMarkup" value="50" min="0" inputmode="decimal" onchange="updateSessionData()">
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Ingredient / Material</th>
          <th>Unit</th>
          <th>Cost per Unit</th>
          <th>Quantity Used</th>
          <th>Total Cost</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="materialsBody"></tbody>
    </table>
    <button class="btn btn-add mobile-full-btn" onclick="addMaterialRow()">+ Add Ingredient</button>

    <div class="summary-section">
      <div class="summary-card">
        <h3>Total Batch Cost</h3>
        <div class="val" id="totalBatchCost">₱0.00</div>
      </div>
      <div class="summary-card">
        <h3>Cost Per Item</h3>
        <div class="val" id="costPerItem">₱0.00</div>
      </div>
      <div class="summary-card final">
        <h3>Suggested Price</h3>
        <div class="val" id="suggestedPrice">₱0.00</div>
      </div>
    </div>
  </div>
</div>

<script>
  let sessions = {};
  let currentSessionId = null;
  const unitsList = ["g", "kg", "ml", "L", "oz", "lb", "pcs", "cup", "tbsp", "tsp"];
  const STORAGE_KEY = "offline_costing_data";

  // Initialize the App
  function initApp() {
    const savedData = localStorage.getItem(STORAGE_KEY);
    if (savedData) {
      sessions = JSON.parse(savedData);
      const keys = Object.keys(sessions);
      if (keys.length > 0) {
        currentSessionId = keys[0];
      } else {
        createSession("Default Product", false);
      }
    } else {
      createSession("Default Product", false);
    }
    renderSessionsUI();
    loadCurrentSessionData();
  }

  // Save to browser memory
  function saveToLocal() {
    if (sessions && Object.keys(sessions).length > 0) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }
  }

  window.createSession = function(nameOverride, doPrompt = true) {
    const id = 'session_' + Date.now();
    let name = nameOverride;
    
    if (doPrompt) {
      name = prompt("Enter new product/session name:", "New Item");
      if (!name) return;
    }

    sessions[id] = {
      name: name,
      yieldQty: 10,
      markupPct: 50,
      materials: [{ name: "Sample Item", unit: "pcs", cost: 1.5, qty: 2 }]
    };
    currentSessionId = id;
    saveToLocal();
    renderSessionsUI();
    loadCurrentSessionData();
  };

  window.deleteCurrentSession = function() {
    if (Object.keys(sessions).length <= 1) {
      alert("You must keep at least one session!");
      return;
    }
    if (confirm("Delete this session?")) {
      delete sessions[currentSessionId];
      currentSessionId = Object.keys(sessions)[0]; // Switch to first available
      saveToLocal();
      renderSessionsUI();
      loadCurrentSessionData();
    }
  };

  function renderSessionsUI() {
    const bar = document.getElementById('sessionBar');
    bar.innerHTML = '<button class="btn btn-add" onclick="createSession()">+ New</button>';
    Object.keys(sessions).forEach(id => {
      const tab = document.createElement('div');
      tab.className = `tab ${id === currentSessionId ? 'active' : ''}`;
      tab.innerText = sessions[id].name || "Item";
      tab.onclick = () => { 
        currentSessionId = id; 
        renderSessionsUI(); 
        loadCurrentSessionData(); 
      };
      bar.insertBefore(tab, bar.firstChild);
    });
  }

  function loadCurrentSessionData() {
    const data = sessions[currentSessionId];
    if (!data) return;

    document.getElementById('prodName').value = data.name || "";
    document.getElementById('prodYield').value = data.yieldQty || 1;
    document.getElementById('prodMarkup').value = data.markupPct || 0;

    const tbody = document.getElementById('materialsBody');
    tbody.innerHTML = "";

    (data.materials || []).forEach((mat, idx) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td data-label="Ingredient"><input type="text" value="${mat.name}" oninput="updateMaterial(${idx}, 'name', this.value)"></td>
        <td data-label="Unit">
          <select onchange="updateMaterial(${idx}, 'unit', this.value)">
            ${unitsList.map(u => `<option value="${u}" ${mat.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
          </select>
        </td>
        <td data-label="Cost/Unit"><input type="number" step="0.01" inputmode="decimal" value="${mat.cost}" oninput="updateMaterial(${idx}, 'cost', parseFloat(this.value)||0)"></td>
        <td data-label="Qty Used"><input type="number" step="0.01" inputmode="decimal" value="${mat.qty}" oninput="updateMaterial(${idx}, 'qty', parseFloat(this.value)||0)"></td>
        <td data-label="Total Cost" class="rowTotal">₱${((mat.cost || 0) * (mat.qty || 0)).toFixed(2)}</td>
        <td data-label="Action"><button class="btn btn-danger" style="margin:0;" onclick="removeMaterial(${idx})">Delete</button></td>
      `;
      tbody.appendChild(row);
    });
    calculateCosting();
  }

  window.updateSessionData = function() {
    if(!sessions[currentSessionId]) return;
    sessions[currentSessionId].name = document.getElementById('prodName').value;
    sessions[currentSessionId].yieldQty = parseFloat(document.getElementById('prodYield').value) || 1;
    sessions[currentSessionId].markupPct = parseFloat(document.getElementById('prodMarkup').value) || 0;
    
    saveToLocal();
    renderSessionsUI(); // Update tab name if changed
    calculateCosting(); // Update math if yield/markup changed
  };

  window.addMaterialRow = function() {
    if (!sessions[currentSessionId].materials) sessions[currentSessionId].materials = [];
    sessions[currentSessionId].materials.push({ name: "", unit: "g", cost: 0, qty: 0 });
    saveToLocal();
    loadCurrentSessionData();
  };

  window.removeMaterial = function(idx) {
    sessions[currentSessionId].materials.splice(idx, 1);
    saveToLocal();
    loadCurrentSessionData();
  };

  window.updateMaterial = function(idx, key, val) {
    sessions[currentSessionId].materials[idx][key] = val;
    saveToLocal();
    
    // If it's a number update, recalculate inline to feel instant
    if(key === 'cost' || key === 'qty') {
      calculateCosting();
      // Update that specific row's total visually without reloading whole table
      const rows = document.getElementById('materialsBody').getElementsByTagName('tr');
      if(rows[idx]) {
        const cost = sessions[currentSessionId].materials[idx].cost || 0;
        const qty = sessions[currentSessionId].materials[idx].qty || 0;
        rows[idx].getElementsByClassName('rowTotal')[0].innerText = '₱' + (cost * qty).toFixed(2);
      }
    }
  };

  window.calculateCosting = function() {
    const yieldQty = parseFloat(document.getElementById('prodYield').value) || 1;
    const markupPct = parseFloat(document.getElementById('prodMarkup').value) || 0;

    let batchTotal = 0;
    (sessions[currentSessionId].materials || []).forEach(m => {
      batchTotal += (m.cost || 0) * (m.qty || 0);
    });

    const costPerItem = batchTotal / yieldQty;
    const suggestedPrice = costPerItem * (1 + (markupPct / 100));

    document.getElementById('totalBatchCost').innerText = `₱${batchTotal.toFixed(2)}`;
    document.getElementById('costPerItem').innerText = `₱${costPerItem.toFixed(2)}`;
    document.getElementById('suggestedPrice').innerText = `₱${suggestedPrice.toFixed(2)}`;
  };

  // Run on page load
  initApp();
</script>

</body>
</html>
