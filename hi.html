<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        
        /* Navigation Menu */
        .nav-menu {
            display: flex;
            background: #e9ecef;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .nav-menu button {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: bold;
            color: #6c757d;
            cursor: pointer;
            border-radius: 0;
            margin-bottom: 0;
        }
        .nav-menu button.active {
            background: #2563eb;
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 16px;
            color: #6c757d;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .summary-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #495057;
            margin-bottom: 8px;
        }
        .summary-row span:last-child {
            font-weight: bold;
            color: #212529;
        }
        .summary-box hr {
            border: 0;
            border-top: 1px solid #dee2e6;
            margin: 10px 0;
        }
        .grand-total {
            font-size: 16px;
            color: #212529;
            font-weight: bold;
        }
        .grand-total-price {
            font-size: 22px;
            color: #2563eb;
            font-weight: bold;
            margin-top: 5px;
        }
        select, input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: white;
        }
        button.action-btn {
            width: 100%;
            padding: 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button.action-btn:hover {
            background-color: #1d4ed8;
        }
        .history h2 {
            font-size: 12px;
            color: #adb5bd;
            text-transform: uppercase;
            border-bottom: 1px solid #f1f3f5;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        
        /* Daily Grouping Styles */
        .date-header {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #495057;
            margin-top: 15px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .date-total {
            color: #2563eb;
        }

        .entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #f8f9fa;
        }
        .entry-item {
            font-weight: 500;
            color: #495057;
        }
        .entry-right {
            display: flex;
            align-items: center;
        }
        .entry-qty, .entry-amt {
            font-weight: bold;
            color: #2563eb;
        }
        .expense-amt {
            color: #dc3545;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 14px;
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
            border-radius: 4px;
        }
        .delete-btn:hover {
            background-color: #ffeeba;
        }
        
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Navigation Menu -->
    <div class="nav-menu">
        <button id="nav-sales" class="active">Sales Tracker</button>
        <button id="nav-budget">Budget & Expenses</button>
    </div>

    <!-- ================= SALES TRACKER VIEW ================= -->
    <div id="view-sales" class="view-section active">
        <h1>Sales Tracker</h1>
        
        <div class="summary-box">
            <div class="summary-row">
                <span>Plain Palitaw (₱5):</span>
                <span id="plain-total">0</span>
            </div>
            <div class="summary-row">
                <span>Ube Palitaw (₱10):</span>
                <span id="ube-total">0</span>
            </div>
            <div class="summary-row">
                <span>Palamig (₱10):</span>
                <span id="palamig-total">0</span>
            </div>
            <hr>
            <div class="summary-row grand-total">
                <span>Overall Items Sold:</span>
                <span id="overall-items">0</span>
            </div>
            <div class="summary-row grand-total-price">
                <span>Overall Sales:</span>
                <span id="overall-price">₱0</span>
            </div>
        </div>

        <select id="item">
            <option value="Plain Palitaw">Plain Palitaw</option>
            <option value="Ube Palitaw with Cheese">Ube Palitaw with Cheese</option>
            <option value="Palamig">Palamig</option>
        </select>
        <input type="number" id="quantity" value="1" min="1" placeholder="Quantity">
        <button id="enter-sale-btn" class="action-btn">Enter Sale</button>

        <div class="history">
            <h2>Daily Records</h2>
            <div id="sales-list">
                <div style="text-align:center; color:#adb5bd; padding:20px 0;">Loading sales...</div>
            </div>
        </div>
    </div>

    <!-- ================= BUDGET & EXPENSE VIEW ================= -->
    <div id="view-budget" class="view-section">
        <h1>Budget & Expenses</h1>
        
        <div class="summary-box">
            <div class="summary-row">
                <span>Total Budget/Income:</span>
                <span id="total-budget" style="color: #198754;">₱0</span>
            </div>
            <div class="summary-row">
                <span>Total Expenses:</span>
                <span id="total-expense" style="color: #dc3545;">₱0</span>
            </div>
            <hr>
            <div class="summary-row grand-total-price">
                <span>Remaining Balance:</span>
                <span id="remaining-balance">₱0</span>
            </div>
        </div>

        <select id="finance-type">
            <option value="budget">Add Budget / Income</option>
            <option value="expense">Deduct Expense</option>
        </select>
        <input type="text" id="finance-desc" placeholder="Description (e.g. Ingredients, Starting Money)">
        <input type="number" id="finance-amount" value="" min="1" placeholder="Amount (₱)">
        <button id="enter-finance-btn" class="action-btn">Save Record</button>

        <div class="history">
            <h2>Financial History</h2>
            <div id="finance-list">
                <div style="text-align:center; color:#adb5bd; padding:20px 0;">Loading finances...</div>
            </div>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyUmdKe6CIH9mwa310erTIXMgmH23J3wU",
        authDomain: "loan-app-ed340.firebaseapp.com",
        projectId: "loan-app-ed340",
        storageBucket: "loan-app-ed340.firebasestorage.app",
        messagingSenderId: "7965113832",
        appId: "1:7965113832:web:56bdbd00c5e213199b785d",
        measurementId: "G-EHH9EDJRMZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Collections
    const salesCollection = collection(db, 'palitaw_sales');
    const financeCollection = collection(db, 'palitaw_finances');

    // === NAVIGATION LOGIC ===
    const navSales = document.getElementById('nav-sales');
    const navBudget = document.getElementById('nav-budget');
    const viewSales = document.getElementById('view-sales');
    const viewBudget = document.getElementById('view-budget');

    navSales.addEventListener('click', () => {
        navSales.classList.add('active');
        navBudget.classList.remove('active');
        viewSales.classList.add('active');
        viewBudget.classList.remove('active');
    });
    navBudget.addEventListener('click', () => {
        navBudget.classList.add('active');
        navSales.classList.remove('active');
        viewBudget.classList.add('active');
        viewSales.classList.remove('active');
    });


    // === SALES TRACKER LOGIC ===
    const enterSaleBtn = document.getElementById('enter-sale-btn');
    const salesList = document.getElementById('sales-list');
    
    enterSaleBtn.addEventListener('click', async () => {
        const item = document.getElementById('item').value;
        const qty = parseInt(document.getElementById('quantity').value);

        if (qty > 0) {
            enterSaleBtn.innerText = "Saving...";
            try {
                await addDoc(salesCollection, { item: item, quantity: qty, timestamp: Date.now() });
                document.getElementById('quantity').value = 1; 
            } catch (e) { alert("Error saving: " + e.message); }
            enterSaleBtn.innerText = "Enter Sale";
        }
    });

    onSnapshot(query(salesCollection, orderBy("timestamp", "desc")), (snapshot) => {
        salesList.innerHTML = '';
        let counts = { "Plain Palitaw": 0, "Ube Palitaw with Cheese": 0, "Palamig": 0 };
        let totalItems = 0;
        
        if (snapshot.empty) {
            salesList.innerHTML = '<div style="text-align:center; color:#adb5bd; padding:20px 0;">No sales yet.</div>';
            document.getElementById('overall-price').innerText = "₱0";
            return;
        }

        // Object to group items by date
        const groupedSales = {};
        const dateOrder = [];

        snapshot.forEach((documentSnapshot) => {
            const sale = documentSnapshot.data();
            const docId = documentSnapshot.id;
            
            // Overall totals
            if (counts[sale.item] !== undefined) counts[sale.item] += sale.quantity;
            totalItems += sale.quantity;
            
            // Grouping by Date
            const dateObj = new Date(sale.timestamp);
            const dateKey = dateObj.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            
            // Determine price for this specific entry
            let entryPrice = 0;
            if (sale.item === "Plain Palitaw") entryPrice = sale.quantity * 5;
            if (sale.item === "Ube Palitaw with Cheese" || sale.item === "Palamig") entryPrice = sale.quantity * 10;

            if (!groupedSales[dateKey]) {
                groupedSales[dateKey] = { list: [], dailyTotal: 0 };
                dateOrder.push(dateKey);
            }
            groupedSales[dateKey].list.push({ id: docId, ...sale, entryPrice });
            groupedSales[dateKey].dailyTotal += entryPrice;
        });

        // Render the grouped list
        dateOrder.forEach(date => {
            // Date Header
            const header = document.createElement('div');
            header.className = 'date-header';
            header.innerHTML = `${date} <span class="date-total">₱${groupedSales[date].dailyTotal}</span>`;
            salesList.appendChild(header);

            // Entries for that date
            groupedSales[date].list.forEach(sale => {
                const div = document.createElement('div');
                div.className = 'entry';
                const timeStr = new Date(sale.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                div.innerHTML = `
                    <span class="entry-item">${sale.item} <span style="font-size:11px; color:#adb5bd; font-weight:normal;">(${timeStr})</span></span>
                    <div class="entry-right">
                        <span class="entry-qty">${sale.quantity}</span>
                        <button class="delete-btn" onclick="deleteRecord('palitaw_sales', '${sale.id}')" title="Delete entry">✖</button>
                    </div>
                `;
                salesList.appendChild(div);
            });
        });

        // Update overall displays
        document.getElementById('plain-total').innerText = counts["Plain Palitaw"];
        document.getElementById('ube-total').innerText = counts["Ube Palitaw with Cheese"];
        document.getElementById('palamig-total').innerText = counts["Palamig"];
        document.getElementById('overall-items').innerText = totalItems;
        let totalPrice = (counts["Plain Palitaw"] * 5) + (counts["Ube Palitaw with Cheese"] * 10) + (counts["Palamig"] * 10);
        document.getElementById('overall-price').innerText = "₱" + totalPrice;
    });


    // === BUDGET & EXPENSE LOGIC ===
    const enterFinanceBtn = document.getElementById('enter-finance-btn');
    const financeList = document.getElementById('finance-list');

    enterFinanceBtn.addEventListener('click', async () => {
        const type = document.getElementById('finance-type').value;
        const desc = document.getElementById('finance-desc').value || "No description";
        const amt = parseFloat(document.getElementById('finance-amount').value);

        if (amt > 0) {
            enterFinanceBtn.innerText = "Saving...";
            try {
                await addDoc(financeCollection, { type: type, desc: desc, amount: amt, timestamp: Date.now() });
                document.getElementById('finance-desc').value = "";
                document.getElementById('finance-amount').value = "";
            } catch (e) { alert("Error saving: " + e.message + ". Did you update Firestore rules?"); }
            enterFinanceBtn.innerText = "Save Record";
        }
    });

    onSnapshot(query(financeCollection, orderBy("timestamp", "desc")), (snapshot) => {
        financeList.innerHTML = '';
        let totalBudget = 0;
        let totalExpense = 0;
        
        if (snapshot.empty) {
            financeList.innerHTML = '<div style="text-align:center; color:#adb5bd; padding:20px 0;">No records yet.</div>';
            document.getElementById('remaining-balance').innerText = "₱0";
            return;
        }

        snapshot.forEach((documentSnapshot) => {
            const data = documentSnapshot.data();
            
            if (data.type === 'budget') totalBudget += data.amount;
            if (data.type === 'expense') totalExpense += data.amount;
            
            const div = document.createElement('div');
            div.className = 'entry';
            const dateStr = new Date(data.timestamp).toLocaleDateString([], {month:'short', day:'numeric'});
            const timeStr = new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const isExpense = data.type === 'expense';
            const amtClass = isExpense ? 'expense-amt' : 'entry-amt';
            const sign = isExpense ? '-' : '+';

            div.innerHTML = `
                <span class="entry-item">${data.desc} <span style="font-size:11px; color:#adb5bd; font-weight:normal;">(${dateStr} ${timeStr})</span></span>
                <div class="entry-right">
                    <span class="${amtClass}">${sign}₱${data.amount}</span>
                    <button class="delete-btn" onclick="deleteRecord('palitaw_finances', '${documentSnapshot.id}')">✖</button>
                </div>
            `;
            financeList.appendChild(div);
        });

        document.getElementById('total-budget').innerText = "₱" + totalBudget;
        document.getElementById('total-expense').innerText = "₱" + totalExpense;
        
        const balance = totalBudget - totalExpense;
        const balanceEl = document.getElementById('remaining-balance');
        balanceEl.innerText = "₱" + balance;
        balanceEl.style.color = balance < 0 ? "#dc3545" : "#2563eb";
    });

    // Global delete function
    window.deleteRecord = async function(collectionName, id) {
        if (confirm("Are you sure you want to delete this entry?")) {
            try {
                await deleteDoc(doc(db, collectionName, id));
            } catch (error) {
                alert("Error deleting: " + error.message);
            }
        }
    };
</script>

</body>
</html>
