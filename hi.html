<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;

<body>

<div class="container">
    <h1>Sales Tracker</h1>
    
    <div class="total-box">
        <div class="total-label">Total Items Sold</div>
        <div class="total-number" id="total-count">0</div>
    </div>

    <div class="form-group">
        <select id="item">
            <option value="Plain Palitaw">Plain Palitaw</option>
            <option value="Ube Palitaw with Cheese">Ube Palitaw with Cheese</option>
            <option value="Palamig">Palamig</option>
        </select>
    </div>

    <div class="form-group">
        <input type="number" id="quantity" value="" placeholder="Qty..." min="1">
    </div>

    <button id="enter-btn" class="enter-btn">Enter Sale</button>

    <div class="history">
        <h2>Recent Entries</h2>
        <div id="entries-list" class="entries-list">
            <div class="empty-state" id="empty-state">Loading sales...</div>
        </div>
    </div>

    <div class="share-section">
        <div class="share-label">Access on another device:</div>
        <div class="share-controls">
            <input type="text" id="share-url" class="share-input" readonly value="Loading...">
            <button id="copy-btn" class="copy-btn">Copy</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global environment variables provided by the sandbox
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "demo-project" };
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // Handle Tracker ID in URL
    let trackerId = new URLSearchParams(window.location.search).get('id');
    if (!trackerId) {
        trackerId = Math.random().toString(36).substring(2, 10);
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('id', trackerId);
        window.history.replaceState({}, '', newUrl);
    }

    // UI Elements
    const shareUrlInput = document.getElementById('share-url');
    shareUrlInput.value = window.location.href;

    const itemSelect = document.getElementById('item');
    const qtyInput = document.getElementById('quantity');
    const enterBtn = document.getElementById('enter-btn');
    const totalCountDisplay = document.getElementById('total-count');
    const entriesList = document.getElementById('entries-list');
    const copyBtn = document.getElementById('copy-btn');

    let collectionRef = null;

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    async function initAuthAndData() {
        try {
            // Authenticate first
            if (initialAuthToken) {
                await signInWithCustomToken(auth, initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }

            if (!auth.currentUser) return;

            // Prepare collection reference using the strict public path
            const collectionName = `sales_${trackerId}`;
            collectionRef = collection(db, 'artifacts', appId, 'public', 'data', collectionName);

            // Fetch data and listen for changes
            onSnapshot(collectionRef, (snapshot) => {
                const sales = [];
                let totalItems = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    sales.push(data);
                    totalItems += data.quantity;
                });

                // Sort by newest first in memory
                sales.sort((a, b) => b.timestamp - a.timestamp);
                
                // Update UI
                totalCountDisplay.innerText = totalItems;
                renderSales(sales);

            }, (error) => {
                console.error("Error fetching data:", error);
                entriesList.innerHTML = `<div class="empty-state">Error loading data.</div>`;
            });

        } catch (error) {
            console.error("Auth error:", error);
            entriesList.innerHTML = `<div class="empty-state">Cannot connect to server.</div>`;
        }
    }

    function renderSales(sales) {
        entriesList.innerHTML = '';
        
        if (sales.length === 0) {
            entriesList.innerHTML = `<div class="empty-state">No sales recorded yet.</div>`;
            return;
        }

        sales.forEach(sale => {
            const div = document.createElement('div');
            div.className = 'entry';
            
            const mainSpan = document.createElement('span');
            mainSpan.className = 'entry-main';
            mainSpan.textContent = `+${sale.quantity} ${sale.item}`;

            const timeSpan = document.createElement('span');
            timeSpan.className = 'entry-time';
            timeSpan.textContent = sale.timeString;

            div.appendChild(mainSpan);
            div.appendChild(timeSpan);
            entriesList.appendChild(div);
        });
    }

    // Handle Entry
    async function handleAddSale() {
        const item = itemSelect.value;
        const qty = parseInt(qtyInput.value, 10);

        if (!qty || qty <= 0) {
            qtyInput.focus();
            return;
        }

        enterBtn.disabled = true;
        enterBtn.textContent = 'Saving...';
        
        const now = new Date();
        const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        try {
            if (collectionRef) {
                await addDoc(collectionRef, {
                    item: item,
                    quantity: qty,
                    timeString: timeString,
                    timestamp: now.getTime()
                });
            }
            qtyInput.value = '';
            qtyInput.focus();
        } catch (error) {
            console.error("Error saving:", error);
        } finally {
            enterBtn.disabled = false;
            enterBtn.textContent = 'Enter Sale';
        }
    }

    enterBtn.addEventListener('click', handleAddSale);
    
    // Press Enter to submit
    qtyInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleAddSale();
        }
    });

    // Handle Copy button
    copyBtn.addEventListener('click', () => {
        document.execCommand('copy'); // Fallback
        navigator.clipboard.writeText(shareUrlInput.value).then(() => {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            copyBtn.style.backgroundColor = '#d1fae5';
            copyBtn.style.color = '#065f46';
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.backgroundColor = '';
                copyBtn.style.color = '';
            }, 2000);
        });
    });

    // Start App
    window.onload = () => {
        qtyInput.focus();
        initAuthAndData();
    };
</script>

</body>
</html>
