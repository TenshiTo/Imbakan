<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 16px;
            color: #6c757d;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .total-box {
            text-align: center;
            margin-bottom: 30px;
        }
        .total-box span.label {
            display: block;
            font-size: 14px;
            color: #adb5bd;
            margin-bottom: 5px;
        }
        .total-box span.number {
            display: block;
            font-size: 48px;
            font-weight: bold;
            color: #1a1e29;
        }
        select, input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: white;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 30px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .history h2 {
            font-size: 12px;
            color: #adb5bd;
            text-transform: uppercase;
            border-bottom: 1px solid #f1f3f5;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .entry {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f8f9fa;
        }
        .entry-item {
            font-weight: 500;
            color: #495057;
        }
        .entry-qty {
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sales Tracker</h1>
    
    <div class="total-box">
        <span class="label">Total Items Sold</span>
        <span class="number" id="total-count">0</span>
    </div>

    <select id="item">
        <option value="Plain Palitaw">Plain Palitaw</option>
        <option value="Ube Palitaw with Cheese">Ube Palitaw with Cheese</option>
        <option value="Palamig">Palamig</option>
    </select>

    <input type="number" id="quantity" value="1" min="1">

    <button id="enter-btn">Enter Sale</button>

    <div class="history">
        <h2>Recent Entries</h2>
        <div id="entries-list">
            <div style="text-align:center; color:#adb5bd; padding:20px 0;">Loading sales...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyUmdKe6CIH9mwa310erTIXMgmH23J3wU",
        authDomain: "loan-app-ed340.firebaseapp.com",
        projectId: "loan-app-ed340",
        storageBucket: "loan-app-ed340.firebasestorage.app",
        messagingSenderId: "7965113832",
        appId: "1:7965113832:web:56bdbd00c5e213199b785d",
        measurementId: "G-EHH9EDJRMZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // EXPLICITLY USING A NEW, SEPARATE COLLECTION
    const salesCollection = collection(db, 'palitaw_sales');

    const itemSelect = document.getElementById('item');
    const qtyInput = document.getElementById('quantity');
    const enterBtn = document.getElementById('enter-btn');
    const totalCountDisplay = document.getElementById('total-count');
    const entriesList = document.getElementById('entries-list');

    enterBtn.addEventListener('click', async () => {
        const item = itemSelect.value;
        const qty = parseInt(qtyInput.value);

        if (qty > 0) {
            enterBtn.innerText = "Saving...";
            enterBtn.style.opacity = "0.7";
            
            try {
                await addDoc(salesCollection, {
                    item: item,
                    quantity: qty,
                    timestamp: Date.now()
                });
                qtyInput.value = 1; 
            } catch (e) {
                alert("Error saving: " + e.message);
            }
            
            enterBtn.innerText = "Enter Sale";
            enterBtn.style.opacity = "1";
        }
    });

    const q = query(salesCollection, orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
        entriesList.innerHTML = '';
        let totalItems = 0;
        
        if (snapshot.empty) {
            entriesList.innerHTML = '<div style="text-align:center; color:#adb5bd; padding:20px 0;">No sales yet.</div>';
            totalCountDisplay.innerText = "0";
            return;
        }

        snapshot.forEach((doc) => {
            const sale = doc.data();
            totalItems += sale.quantity;
            
            const div = document.createElement('div');
            div.className = 'entry';
            const timeString = new Date(sale.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            div.innerHTML = `
                <span class="entry-item">${sale.item} <span style="font-size:11px; color:#adb5bd; font-weight:normal;">(${timeString})</span></span>
                <span class="entry-qty">${sale.quantity}</span>
            `;
            entriesList.appendChild(div);
        });

        totalCountDisplay.innerText = totalItems;
    }, (error) => {
        entriesList.innerHTML = `<div style="text-align:center; color:red; padding:20px 0;">Connection error. Please check your rules.</div>`;
        console.error("Firebase error:", error);
    });
</script>

</body>
</html>
